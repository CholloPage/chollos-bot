name: Publicar chollo

on:
  schedule:
    # Horas en UTC. Diez publicaciones al dia y ninguna de madrugada.
    #
    # Franjas punta: Instagram, Facebook y Telegram. En horario de verano
    # de Espana son las 8, 12, 19 y 21; en invierno, una hora menos.
    - cron: "0 6,10,17,19 * * *"
    # Resto del dia: solo Telegram. En verano, las 7, 9, 11, 13, 17 y 20.
    # Si Telegram aun no esta configurado, estas no hacen nada y no gastan
    # oferta.
    - cron: "0 5,7,9,11,15,18 * * *"
  workflow_dispatch:   # boton para lanzarlo a mano desde la pestana Actions
    inputs:
      solo_telegram:
        description: "Publicar solo en Telegram"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    env:
      AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      # Que franja ha disparado esta ejecucion. Tiene que coincidir letra
      # a letra con la segunda linea de cron de arriba.
      SOLO_TELEGRAM: ${{ ((github.event_name == 'schedule' && github.event.schedule == '0 5,7,9,11,15,18 * * *') || (github.event_name == 'workflow_dispatch' && inputs.solo_telegram)) && '1' || '0' }}
      MARCA: ${{ vars.MARCA }}
      PAGES_URL: ${{ vars.PAGES_URL }}
      # Servimos la imagen desde raw.githubusercontent: esta disponible
      # nada mas hacer push, sin esperar al despliegue de Pages.
      IMAGENES_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs/img

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instalar ffmpeg (para los Reels)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # El cron salta en punto, pero publicar siempre a las 10:00 clavadas
      # canta a bot. Esperamos un rato al azar, como mucho 20 minutos, para
      # no invadir la franja siguiente.
      - name: Esperar un rato al azar
        if: github.event_name == 'schedule'
        run: |
          ESPERA=$((RANDOM % 1200))
          echo "Esperando $ESPERA segundos para no publicar siempre en punto."
          sleep $ESPERA

      - name: Preparar la oferta
        run: python bot.py preparar

      - name: Salir si no habia nada pendiente
        id: comprobar
        run: |
          if [ -f pendiente.json ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "No quedan ofertas pendientes. Anade mas filas a ofertas.csv."
          fi

      - name: Subir la imagen al repositorio
        if: steps.comprobar.outputs.hay == 'si'
        run: |
          git config user.name  "bot-chollos"
          git config user.email "bot-chollos@users.noreply.github.com"
          git add docs/img
          git commit -m "Imagen de la oferta $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          # Si alguien (o yo mismo) ha tocado el repo mientras corriamos, el
          # push se rechaza. Traemos lo de arriba y reintentamos en vez de
          # tirar a la basura una ejecucion entera.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rechazado. Reintento $intento tras traer los cambios."
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          git push

      - name: Publicar en redes
        if: steps.comprobar.outputs.hay == 'si'
        run: python bot.py publicar

      - name: Guardar estado y pagina de bio
        if: steps.comprobar.outputs.hay == 'si'
        run: |
          git add estado.json docs
          git commit -m "Chollo publicado $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          # Si alguien (o yo mismo) ha tocado el repo mientras corriamos, el
          # push se rechaza. Traemos lo de arriba y reintentamos en vez de
          # tirar a la basura una ejecucion entera.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rechazado. Reintento $intento tras traer los cambios."
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          git push

      - name: Dejar el paquete de TikTok descargable
        if: steps.comprobar.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-${{ github.run_number }}
          path: salida_tiktok/
          retention-days: 14
