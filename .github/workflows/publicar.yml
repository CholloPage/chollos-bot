name: Publicar chollo

on:
  schedule:
    # Las publicaciones van por HORA DE MADRID: 7, 8, 9, 11, 12, 13, 17,
    # 19, 20 y 21, todo el ano. GitHub solo entiende UTC y Espana cambia
    # de hora dos veces al ano, asi que aqui salta a todas las horas UTC
    # que pueden caer en esas franjas (verano UTC+2 e invierno UTC+1) y el
    # primer trabajo, "hora", deja pasar solo la que toca en Madrid.
    # Cada hora va en su propia linea para saber cual ha disparado aunque
    # GitHub se retrase: asi un retraso nunca mueve la franja.
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 9 * * *"
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 16 * * *"
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:   # boton para lanzarlo a mano desde la pestana Actions
    inputs:
      solo_telegram:
        description: "Publicar solo en Telegram"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  hora:
    runs-on: ubuntu-latest
    outputs:
      toca: ${{ steps.madrid.outputs.toca }}
    steps:
      - id: madrid
        env:
          EVENTO: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          FRANJAS=" 7 8 9 11 12 13 17 19 20 21 "
          if [ "$EVENTO" != "schedule" ]; then
            echo "Lanzado a mano: se publica."
            echo "toca=si" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Hora UTC que pedia este cron (no la de arranque, por si hubo retraso)
          H_UTC=$(echo "$CRON" | awk '{print $2}')
          H_MADRID=$(TZ=Europe/Madrid date -d "$(date -u +%Y-%m-%d) ${H_UTC}:00 UTC" +%-H)
          echo "Cron de las ${H_UTC}:00 UTC = las ${H_MADRID}:00 en Madrid."
          case "$FRANJAS" in
            *" $H_MADRID "*) echo "Franja de publicacion."; echo "toca=si" >> "$GITHUB_OUTPUT" ;;
            *) echo "No es franja en Madrid. No se publica."; echo "toca=no" >> "$GITHUB_OUTPUT" ;;
          esac

  publicar:
    needs: hora
    if: needs.hora.outputs.toca == 'si'
    runs-on: ubuntu-latest
    # Nunca dos publicaciones a la vez (se pisarian el estado.json).
    concurrency:
      group: publicar
      cancel-in-progress: false
    env:
      AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
      META_TOKEN: ${{ secrets.META_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CANAL: ${{ secrets.TELEGRAM_CANAL }}
      # Solo Telegram unicamente si se lanza a mano con esa casilla marcada.
      # Las ejecuciones programadas publican en todas partes.
      SOLO_TELEGRAM: ${{ (github.event_name == 'workflow_dispatch' && inputs.solo_telegram) && '1' || '0' }}
      MARCA: ${{ vars.MARCA }}
      PAGES_URL: ${{ vars.PAGES_URL }}
      # Servimos la imagen desde raw.githubusercontent: esta disponible
      # nada mas hacer push, sin esperar al despliegue de Pages.
      IMAGENES_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/docs/img

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instalar ffmpeg (para los Reels)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      # El cron salta en punto, pero publicar siempre a las 10:00 clavadas
      # canta a bot. Esperamos un rato al azar, como mucho 15 minutos, para
      # no invadir la franja siguiente.
      - name: Esperar un rato al azar
        if: github.event_name == 'schedule'
        run: |
          ESPERA=$((RANDOM % 900))
          echo "Esperando $ESPERA segundos para no publicar siempre en punto."
          sleep $ESPERA

      - name: Preparar la oferta
        run: python bot.py preparar

      - name: Salir si no habia nada pendiente
        id: comprobar
        run: |
          if [ -f pendiente.json ]; then
            echo "hay=si" >> "$GITHUB_OUTPUT"
          else
            echo "hay=no" >> "$GITHUB_OUTPUT"
            echo "No quedan ofertas pendientes. Anade mas filas a ofertas.csv."
          fi

      - name: Subir la imagen al repositorio
        if: steps.comprobar.outputs.hay == 'si'
        run: |
          git config user.name  "bot-chollos"
          git config user.email "bot-chollos@users.noreply.github.com"
          git add docs/img
          git commit -m "Imagen de la oferta $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          # Si alguien (o yo mismo) ha tocado el repo mientras corriamos, el
          # push se rechaza. Traemos lo de arriba y reintentamos en vez de
          # tirar a la basura una ejecucion entera.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rechazado. Reintento $intento tras traer los cambios."
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          git push

      - name: Publicar en redes
        if: steps.comprobar.outputs.hay == 'si'
        run: python bot.py publicar

      - name: Guardar estado y pagina de bio
        if: steps.comprobar.outputs.hay == 'si'
        run: |
          git add estado.json docs
          git commit -m "Chollo publicado $(date -u +%Y-%m-%dT%H:%M)" || exit 0
          # Si alguien (o yo mismo) ha tocado el repo mientras corriamos, el
          # push se rechaza. Traemos lo de arriba y reintentamos en vez de
          # tirar a la basura una ejecucion entera.
          for intento in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rechazado. Reintento $intento tras traer los cambios."
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          git push

      - name: Dejar el paquete de TikTok descargable
        if: steps.comprobar.outputs.hay == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-${{ github.run_number }}
          path: salida_tiktok/
          retention-days: 14
